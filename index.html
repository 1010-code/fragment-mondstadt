<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欧西匹克特秀</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body { background:#000; color:#e8f1ff; font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
         user-select:none; cursor:default; }

  /* ============ 星空（状态0） ============ */
  #bg-stars { position:fixed; inset:0; z-index:3; transition:opacity 1.8s ease; }
  #bg-stars.gone { opacity:0; pointer-events:none; }
  .star { position:absolute; border-radius:50%; background:#fff;
          box-shadow:0 0 6px rgba(255,255,255,.85); animation:twinkle 1.5s ease-in-out forwards; }
  @keyframes twinkle { 0%{opacity:0; transform:scale(.6);} 30%{opacity:.6; transform:scale(1);} 100%{opacity:0; transform:scale(.7);} }

  /* ============ 场景 ============ */
  #scene { position:fixed; inset:0; z-index:2; opacity:0; transition:opacity 1.5s ease; }
  #scene.visible { opacity:1; }
  #ground { position:absolute; left:0; right:0; top:70%; height:30vh;
            background:linear-gradient(to bottom, rgba(25,36,58,.0), rgba(8,14,26,.55)); }
  #road { position:absolute; left:0; right:0; top:70%; height:0; border-top:2px solid rgba(150,185,235,.55);
          box-shadow:0 0 14px rgba(120,175,255,.35); }

  /* ============ 小人 ============ */
  #person-wrap { position:absolute; left:50%; top:70%; transform:translate(-50%,-100%); z-index:6; }
  #person-shadow { position:absolute; left:50%; bottom:-9px; width:74px; height:10px; transform:translateX(-50%);
                   border-radius:50%; background:radial-gradient(closest-side, rgba(0,0,0,.8), transparent 70%); filter:blur(2px); }
  #person { position:relative; width:60px; height:104px; }
  #person img { width:auto; height:110px; object-fit:contain; position:absolute; left:50%; top:0;
                transform:translateX(-50%); transition:opacity .2s; }
  #action-img { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); opacity:0;
                pointer-events:none; height:110px; width:auto; transition:opacity .2s; }
  #person-wrap.attacking #action-img{opacity:1 !important;}
  #person-wrap.attacking #person img{opacity:0;}

  /* 收包后向右跑出画面（9次成功，6秒） */
  #person-wrap.running-away { animation:runAway 6s linear forwards; }
  @keyframes runAway { from{ transform:translate(-50%,-100%);} to{ transform:translate(105vw,-100%);} }

  /* ============ 冰锥 ============ */
  #ice, #ice-hit { position:absolute; z-index:8; width:72px; height:48px; top:60%; left:0;
                   pointer-events:none; display:none; }
  #ice .spr, #ice-hit .spr { width:72px; height:48px; background-repeat:no-repeat; image-rendering:pixelated; }
  #ice .spr { background-size:720px 48px; animation:iceRun 1s steps(10) infinite; }
  @keyframes iceRun { from{ background-position:0 0;} to{ background-position:-720px 0;} }
  #ice-hit .spr { background-size:576px 48px; animation:iceHit .5s steps(8) forwards; }
  @keyframes iceHit { from{ background-position:0 0;} to{ background-position:-576px 0;} }

  /* ============ 掉落物 ============ */
  #drop-wrap { position:absolute; z-index:10; width:56px; height:56px; pointer-events:none; opacity:0;
               transition:opacity .3s ease; }
  #drop-wrap.ready { pointer-events:auto; opacity:1; }
  #drop-wrap.dropping { animation:dropFall .7s cubic-bezier(.3,.6,.4,1) forwards; }
  #drop-wrap.dropping #drop-img { animation:tremble .7s ease-out forwards; }
  #drop-wrap.settled #drop-img { animation:floaty 2.8s ease-in-out infinite; }
  @keyframes dropFall { 0%{ transform:translateY(-34vh);} 100%{ transform:translateY(0);} }
  @keyframes tremble {
    0%{ transform:translate(0,0) rotate(0);}
    14%{ transform:translate(-14px,0) rotate(-6deg);}
    30%{ transform:translate(11px,0) rotate(5deg);}
    46%{ transform:translate(-7px,0) rotate(-3deg);}
    62%{ transform:translate(4px,0) rotate(2deg);}
    80%{ transform:translate(-2px,0) rotate(-1deg);}
    100%{ transform:translate(0,0) rotate(0);}
  }
  @keyframes floaty { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }
  #drop-img { width:56px; height:56px; object-fit:contain; display:block;
              filter:drop-shadow(0 0 12px rgba(140,210,255,.6)); }
  #drop-glow { position:absolute; left:-28px; top:-28px; width:112px; height:112px; border-radius:50%;
               background:radial-gradient(circle, rgba(90,180,255,.3), transparent 65%);
               animation:glowPulse 2.4s ease-in-out infinite; }
  @keyframes glowPulse { 0%,100%{ opacity:.5; transform:scale(.9);} 50%{ opacity:1; transform:scale(1.1);} }

  /* ============ 背包 ============ */
  #backpack { position:fixed; top:18px; right:22px; z-index:20; opacity:0; transform:scale(.3);
              cursor:pointer; filter:drop-shadow(0 0 10px rgba(120,190,255,.8));
              transition:opacity .35s ease, transform .35s cubic-bezier(.34,1.56,.64,1); }
  #backpack.show { opacity:1; transform:scale(1); }
  #backpack.flash { animation:packFlash .55s ease; }
  @keyframes packFlash { 0%{ transform:scale(1);} 40%{ transform:scale(1.28) rotate(-8deg);
                          filter:drop-shadow(0 0 30px rgba(150,220,255,1));} 100%{ transform:scale(1);} }
  #backpack img { width:40px; height:40px; object-fit:contain; display:block;
                  filter:drop-shadow(0 0 10px rgba(120,190,255,.8)); }

  /* ============ 扩散光芒（状态0→1） ============ */
  #reveal-glow { position:fixed; width:46vmin; height:46vmin; margin:-23vmin 0 0 -23vmin; border-radius:50%; z-index:5;
                 opacity:0; pointer-events:none;
                 background:radial-gradient(circle, rgba(255,255,255,.96) 0%, rgba(190,222,255,.65) 28%,
                                            rgba(120,175,255,.3) 52%, transparent 72%); }
  #reveal-glow.expand { animation:glowExpand 1.8s ease-out forwards; }
  @keyframes glowExpand { 0%{ opacity:0; transform:scale(0);} 8%{ opacity:1;} 85%{ opacity:.6;} 100%{ opacity:0; transform:scale(85);} }

  /* ============ 弹窗 ============ */
  #modal { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:60;
           background:rgba(2,6,14,.66); backdrop-filter:blur(4px); opacity:0; pointer-events:none; transition:opacity .28s ease; }
  #modal.open { opacity:1; pointer-events:auto; }
  .modal-card { position:relative; width:min(460px,90vw); max-height:76vh; overflow-y:auto; padding:30px 30px 26px;
                background:linear-gradient(160deg, rgba(16,26,46,.95), rgba(8,14,30,.97));
                border:1px solid rgba(120,185,255,.35); border-radius:18px;
                box-shadow:0 0 70px rgba(80,150,255,.28), inset 0 0 40px rgba(90,160,255,.06);
                transform:scale(.92); transition:transform .3s cubic-bezier(.34,1.56,.64,1); text-align:center;
                scrollbar-width:thin; scrollbar-color:rgba(120,180,255,.4) transparent; }
  #modal.open .modal-card { transform:scale(1); }
  .modal-title { font-size:17px; letter-spacing:.22em; color:#bfe0ff; margin-bottom:6px; }
  .modal-sub { font-size:13px; color:rgba(200,225,255,.65); margin-bottom:18px; }
  .modal-close { position:absolute; top:14px; right:16px; width:32px; height:32px; border:none; border-radius:50%;
                 background:rgba(120,180,255,.12); color:#cfe6ff; font-size:16px; line-height:1; cursor:pointer;
                 transition:background .2s, transform .2s; }
  .modal-close:hover { background:rgba(120,180,255,.3); transform:rotate(90deg); }
  .bag-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(64px,1fr)); gap:10px; justify-items:center; }
  .bag-item { width:56px; height:56px; display:flex; align-items:center; justify-content:center;
              background:rgba(120,180,255,.08); border:1px solid rgba(120,185,255,.25); border-radius:12px; }
  .bag-item img { width:44px; height:44px; object-fit:contain; }
  .bag-empty { color:rgba(200,225,255,.5); font-size:14px; padding:18px 0; }

  #toast { position:fixed; top:22%; left:50%; transform:translate(-50%,-50%); z-index:70; padding:12px 22px;
           border-radius:30px; background:rgba(10,20,40,.85); border:1px solid rgba(130,190,255,.4);
           color:#d9ecff; font-size:14px; letter-spacing:.12em; opacity:0; transition:opacity .3s ease;
           pointer-events:none; white-space:nowrap; }
  #toast.show { opacity:1; }
</style>
</head>
<body>

  <!-- 状态0：星空 -->
  <div id="bg-stars"></div>

  <!-- 扩散光芒（入场） -->
  <div id="reveal-glow"></div>

  <!-- 主场景 -->
  <main id="scene">
    <div id="ground"></div>
    <div id="road"></div>

    <!-- 小人 -->
    <div id="person-wrap">
      <div id="person-shadow"></div>
      <div id="person"></div>
      <img id="action-img" alt="攻击">
    </div>
  </main>

  <!-- 冰锥 -->
  <div id="ice"><div class="spr"></div></div>
  <div id="ice-hit"><div class="spr"></div></div>

  <!-- 掉落物 -->
  <div id="drop-wrap">
    <div id="drop-glow"></div>
    <img id="drop-img" alt="掉落物" draggable="false">
  </div>

  <!-- 背包 -->
  <div id="backpack">🎒</div>

  <!-- 弹窗 -->
  <div id="modal">
    <div class="modal-card">
      <button class="modal-close" title="关闭">✕</button>
      <div class="modal-title">海螺</div>
      <div class="modal-sub" id="bag-sub">已收集 0 / 9 个物品</div>
      <div class="bag-grid" id="bag-grid"></div>
    </div>
  </div>

  <div id="toast"></div>

<script>
"use strict";

/* ============================================================
 * 配置（素材替换入口）
 * ============================================================ */
const CONFIG = {
  MUSIC_SRC: "bgm.mp3",
  WALK_IMG: "run.gif",          // 行走小人（持续跑动）
  ACTION_IMG: "slam.gif",       // 点击攻击动作
  FRAGMENT_IMG: "fragment.png", // 第一次掉落的碎片
  BACKPACK_IMG: "backpack.png",
  ICE_REPEAT: "ice-repeatable.png", // 冰锥飞行帧（10帧）
  ICE_HIT: "ice-hit.png",           // 冰锥命中碎裂帧（8帧）
  GLASS_SFX_SRC: "",
  DROPS: ["fragment.png", "drops/m-10.png", "drops/ag-03.png", "drops/a-02.png", "drops/a-00.png", "drops/a-01.png", "drops/a-03.png", "drops/a-06.png", "drops/a-19.png"]   // 固定9个掉落物（每次顺序随机）
};

/* 状态机 */
const State = { BOOT:0, PLAY:1 };
let state = State.BOOT;
let busy = false;
let modalOpen = false;

const $ = (id) => document.getElementById(id);
const starsEl = $("bg-stars"), sceneEl = $("scene"), personWrap = $("person-wrap"),
      personEl = $("person"), actionImg = $("action-img"),
      iceEl = $("ice"), iceHitEl = $("ice-hit"),
      dropWrap = $("drop-wrap"), dropImg = $("drop-img"),
      backpackEl = $("backpack"), toastEl = $("toast"), modalEl = $("modal"),
      revealGlow = $("reveal-glow");

/* 冰锥 / 掉落 / 计数 */
let ice = null;                 // { active, x, done }
let dropActive = false;         // 是否有待收集的掉落物
let hitCount = 0;               // 成功击打次数
let pendingRunaway = false;     // 第9次命中后，等待本次掉落物收包
let collected = [];             // 已收集物品
let iceTimer = null;
let runawayStarted = false;
let dropOrder = [];

/* ============================================================
 * 背景音乐
 * ============================================================ */
const bgm = new Audio(CONFIG.MUSIC_SRC);
bgm.loop = true; bgm.preload = "auto";
bgm.id = "bgm"; document.body.appendChild(bgm);
let musicFirstPlay = true;
function ensureMusic(){
  const p = bgm.play();
  if (p && p.catch) p.catch(()=>{ document.body.dataset.music = "blocked"; });
  p && p.then(()=>{
    document.body.dataset.music = "playing";
    if (musicFirstPlay){
      musicFirstPlay = false;
      bgm.volume = 0;
      const fade = setInterval(()=>{
        bgm.volume = Math.min(0.8, bgm.volume + 0.05);
        if (bgm.volume >= 0.8) clearInterval(fade);
      }, 130);
    }
  }).catch(()=>{});
}

/* ============================================================
 * 音效
 * ============================================================ */
let actx = null;
function getAudioCtx(){
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function playGlassBreak(){
  if (CONFIG.GLASS_SFX_SRC){
    try { const a = new Audio(CONFIG.GLASS_SFX_SRC); a.volume = 0.9; a.play().catch(()=>{}); return; } catch(e){}
  }
  try {
    const ctx = getAudioCtx();
    const dur = 0.9, rate = ctx.sampleRate;
    const buf = ctx.createBuffer(1, Math.floor(rate*dur), rate);
    const data = buf.getChannelData(0);
    for (let i=0;i<data.length;i++){
      const t = i/data.length;
      data[i] = (Math.random()*2-1) * Math.pow(1-t, 2.6) * (0.45 + 0.55*Math.random());
    }
    const src = ctx.createBufferSource(); src.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=3800; bp.Q.value=0.7;
    const hp = ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=1600;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(1.0, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    src.connect(bp); bp.connect(hp); hp.connect(gain); gain.connect(ctx.destination);
    src.start();
    [5200,7200,4300].forEach((f,i)=>{
      const o = ctx.createOscillator(); o.type="sine"; o.frequency.value = f*(1+Math.random()*0.2);
      const g = ctx.createGain(); const t0 = ctx.currentTime + i*0.03;
      g.gain.setValueAtTime(0.001, t0);
      g.gain.exponentialRampToValueAtTime(0.3, t0+0.006);
      g.gain.exponentialRampToValueAtTime(0.001, t0+0.13);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0+0.16);
    });
  } catch(e){}
}

/* ============================================================
 * 星空（状态0）
 * ============================================================ */
let starTimer = null;
function spawnStar(){
  if (state !== State.BOOT) return;
  const s = document.createElement("div");
  s.className = "star";
  s.style.left = (Math.random()*100) + "vw";
  s.style.top  = (Math.random()*100) + "vh";
  const size = 1.5 + Math.random()*2.5;
  s.style.width = s.style.height = size + "px";
  if (Math.random() < 0.35){ s.style.background = "#cfe4ff"; s.style.boxShadow = "0 0 8px rgba(160,210,255,.9)"; }
  starsEl.appendChild(s);
  s.addEventListener("animationend", ()=>s.remove());
  starTimer = setTimeout(spawnStar, 1000 + Math.random()*2000);
}
function stopStars(){
  if (starTimer) clearTimeout(starTimer);
  starsEl.classList.add("gone");
}

/* ============================================================
 * 状态切换：BOOT -> PLAY
 * ============================================================ */
function enterPlay(){
  if (busy) return;
  busy = true;
  ensureMusic(); getAudioCtx();

  revealGlow.style.left = "50%";
  revealGlow.style.top  = "calc(70% - 5vh)";
  revealGlow.classList.add("expand");
  sceneEl.classList.add("visible");
  stopStars();
  setTimeout(()=>{ revealGlow.classList.remove("expand"); }, 2100);

  setTimeout(()=>{
    state = State.PLAY;
    busy = false;
    syncDbg();
    startIceScheduler();
  }, 2000);
}

/* ============================================================
 * 冰锥系统：随机出现，保证每10秒内一定有冰锥
 * ============================================================ */
function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function initDropOrder(){ dropOrder = shuffle(CONFIG.DROPS.slice()); }

function startIceScheduler(){
  iceTimer = setTimeout(spawnIce, 1500 + Math.random()*2000);
}
function scheduleNextIce(){
  // 上一支冰锥结束后 3~7 秒内必出下一支（保证每10秒内一定有冰锥飞过）
  iceTimer = setTimeout(spawnIce, 3000 + Math.random()*4000);
}
function spawnIce(){
  if (state !== State.PLAY || runawayStarted) return;
  if (ice && ice.active && !ice.done) { scheduleNextIce(); return; }

  iceEl.style.display = "block";
  iceEl.querySelector(".spr").style.backgroundImage = "url('" + CONFIG.ICE_REPEAT + "')";
  iceHitEl.querySelector(".spr").style.backgroundImage = "url('" + CONFIG.ICE_HIT + "')";
  // 随机高度（对准小人附近）
  iceEl.style.top = (55 + Math.random()*10) + "%";

  const vw = window.innerWidth;
  const startX = vw + 120;
  const endX = -320;
  const duration = 4000; // 4秒从左到右（从右到左？从右外到左外）
  const t0 = performance.now();
  ice = { active:true, x: startX, done:false };
  syncDbg();

  function frame(t){
    if (!ice || ice.done) return;
    const p = Math.min(1, (t - t0) / duration);
    const x = startX + (endX - startX) * p;
    ice.x = x;
    iceEl.style.transform = "translateX(" + x + "px)";
    if (p >= 1){ iceGone(); return; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function iceGone(){
  iceEl.style.display = "none";
  ice = null;
  syncDbg();
  if (state === State.PLAY && !runawayStarted) scheduleNextIce();
}

/* 点击攻击：命中判定 */
const HIT_WINDOW = 150; // 命中判定半径（px）
function attack(){
  if (busy || state !== State.PLAY || runawayStarted) return;
  // 小人的 x 中心
  const personX = window.innerWidth / 2;

  personWrap.classList.add("attacking");
  setTimeout(()=>{ personWrap.classList.remove("attacking"); }, 800);

  if (ice && ice.active && !ice.done && Math.abs((ice.x + 72) - personX) <= HIT_WINDOW){
    onHit(ice.x);
  }
}

function onHit(iceX){
  ice.done = true;
  iceEl.style.display = "none";
  ice = null;
  syncDbg();
  if (state === State.PLAY && !runawayStarted) scheduleNextIce();
  hitCount++;
  syncDbg();

  // 冰锥碎裂动画
  iceHitEl.style.left = "0";
  iceHitEl.style.top = (55 + Math.random()*10) + "%";
  iceHitEl.style.display = "block";
  iceHitEl.style.transform = "translateX(" + (iceX - 72) + "px)";
  iceHitEl.querySelector(".spr").classList.remove("anim");
  void iceHitEl.querySelector(".spr").offsetWidth;
  iceHitEl.querySelector(".spr").classList.add("anim");
  setTimeout(()=>{ iceHitEl.style.display = "none"; }, 550);

  playGlassBreak();

  // 掉落物品：固定9个（顺序已随机），按击打次数依次掉落
  if (hitCount <= 9){
    spawnDrop(dropOrder[hitCount - 1]);
  }

  if (hitCount >= 9) pendingRunaway = true;
}

/* 掉落物 */
function spawnDrop(src){
  dropActive = true;
  syncDbg();
  // 先隐藏，避免闪现上一个物品
  dropWrap.style.opacity = "0";
  dropWrap.classList.remove("settled","ready","dropping");
  dropWrap.style.position = "";
  dropWrap.style.transform = "";
  // 随机掉落位置（小人前方一段范围，避免互相覆盖）
  const personX = window.innerWidth / 2;
  dropWrap.style.left = (personX + 30 + Math.random()*210) + "px";
  dropWrap.style.top = "70%";
  dropImg.onload = () => {
    dropImg.onload = null;
    void dropWrap.offsetWidth;
    dropWrap.classList.add("dropping");
    dropWrap.style.opacity = "1";
    setTimeout(()=>{
      dropWrap.classList.remove("dropping");
      dropWrap.classList.add("settled","ready");
    }, 750);
  };
  dropImg.src = src;
  if (dropImg.complete && dropImg.naturalWidth > 0) dropImg.onload();
}

/* 收集：飞入背包 */
function collectDrop(){
  if (!dropActive || busy) return;
  dropActive = false;
  dropWrap.classList.remove("ready");
  const src = dropImg.src;
  collected.push(src);
  dropImg.removeAttribute("src"); // 清除旧图，防止下一次闪现
  syncDbg();

  // 从掉落位置弧线飞向右上角背包
  const from = dropWrap.getBoundingClientRect();
  const packRect = backpackEl.getBoundingClientRect();
  const fromX = from.left + from.width/2, fromY = from.top + from.height/2;
  const toX = packRect.left + packRect.width/2, toY = packRect.top + packRect.height/2;
  const t0 = performance.now(), dur = 600;
  dropWrap.style.position = "fixed";
  dropWrap.style.left = "0px";
  dropWrap.style.top = "0px";
  dropWrap.style.transform = "translate(" + fromX + "px," + fromY + "px)";

  function fly(t){
    const p = Math.min(1, (t - t0) / dur);
    const e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p+2,2)/2; // ease-in-out
    const arc = Math.sin(p * Math.PI) * -140; // 弧线
    const x = fromX + (toX - fromX) * e;
    const y = fromY + (toY - fromY) * e + arc;
    dropWrap.style.transform = "translate(" + x + "px," + y + "px) scale(" + (1 - 0.85*e) + ")";
    if (p < 1){ requestAnimationFrame(fly); }
    else { dropWrap.style.opacity = "0"; backpackFlash(); }
  }
  requestAnimationFrame(fly);

  setTimeout(()=>{ dropWrap.style.opacity = "0"; dropWrap.classList.remove("settled"); }, 620);

  if (pendingRunaway){ pendingRunaway = false; setTimeout(startRunaway, 400); }
}

function backpackFlash(){
  if (!backpackEl.classList.contains("show")){
    backpackEl.classList.add("show");
  }
  backpackEl.classList.remove("flash"); void backpackEl.offsetWidth;
  backpackEl.classList.add("flash");
  setTimeout(()=>{ backpackEl.classList.remove("flash"); }, 650);
}

/* 9次成功后：小人向右跑（6秒），保持页面 */
function startRunaway(){
  if (runawayStarted) return;
  runawayStarted = true;
  syncDbg();
  if (iceTimer) clearTimeout(iceTimer);
  if (ice) { ice.done = true; iceEl.style.display = "none"; ice = null; }
  personWrap.classList.add("running-away");
}

/* ============================================================
 * 背包弹窗
 * ============================================================ */
function openModal(){
  if (modalOpen) return;
  modalOpen = true;
  $("bag-sub").textContent = "已收集产品：" + collected.length + "/9";
  const grid = $("bag-grid");
  grid.innerHTML = "";
  if (collected.length === 0){
    const d = document.createElement("div");
    d.className = "bag-empty";
    d.textContent = "还没有收集到物品";
    grid.appendChild(d);
  } else {
    collected.forEach(src => {
      const it = document.createElement("div");
      it.className = "bag-item";
      const img = document.createElement("img");
      img.src = src;
      img.alt = "物品";
      it.appendChild(img);
      grid.appendChild(it);
    });
  }
  modalEl.classList.add("open");
}
function closeModal(){
  if (!modalOpen) return;
  modalOpen = false;
  modalEl.classList.remove("open");
}

/* ============================================================
 * 全局交互
 * ============================================================ */
document.addEventListener("pointerdown", (e)=>{
  ensureMusic();
  if (modalOpen){
    if (!e.target.closest(".modal-card")) closeModal();
    return;
  }
  if (busy) return;
  switch (state){
    case State.BOOT: enterPlay(); break;
    case State.PLAY:
      if (dropActive && e.target.closest("#drop-wrap")) collectDrop();
      else attack();
      break;
  }
});

modalEl.querySelector(".modal-close").addEventListener("click", closeModal);
window.addEventListener("keydown", (e)=>{ if (e.key === "Escape") closeModal(); });

/* 背包点击（在 PACK 后可用） */
document.addEventListener("pointerdown", (e)=>{
  if (state === State.PLAY && !dropActive && !modalOpen && e.target.closest("#backpack")) openModal();
});

/* ============================================================
 * 素材初始化
 * ============================================================ */
function applyConfig(){
  personEl.innerHTML = '<img src="' + CONFIG.WALK_IMG + '" alt="行走小人" draggable="false">';
  actionImg.src = CONFIG.ACTION_IMG;
  backpackEl.innerHTML = '<img src="' + CONFIG.BACKPACK_IMG + '" alt="背包">';
}

/* 调试钩子 */
window.__dbg = () => ({
  state, busy, hitCount, dropActive, runawayStarted, collected: collected.length,
  iceActive: !!(ice && ice.active && !ice.done)
});
function syncDbg(){
  document.body.dataset.state = state;
  document.body.dataset.hits = hitCount;
  document.body.dataset.dropActive = dropActive ? "1" : "0";
  document.body.dataset.collected = collected.length;
  document.body.dataset.runaway = runawayStarted ? "1" : "0";
  document.body.dataset.ice = (ice && ice.active && !ice.done) ? "1" : "0";
}

/* ============================================================
 * 启动
 * ============================================================ */
window.addEventListener("load", ()=>{
  applyConfig();
  initDropOrder();
  ensureMusic();
  for (let i = 0; i < 6; i++) setTimeout(spawnStar, i * 160);
  starTimer = setTimeout(spawnStar, 1200);
});
</script>
</body>
</html>
