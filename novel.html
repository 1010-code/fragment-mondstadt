<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛博朋克 · 新上海2049</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse at 20% 30%, rgba(0,240,255,.16), transparent 55%),
      radial-gradient(ellipse at 85% 75%, rgba(255,0,200,.13), transparent 55%),
      #0a0e17;
    color:#e0f7fa;
    font-family:'Share Tech Mono','Orbitron',monospace;
    user-select:none; cursor:default;
  }
  /* 科技网格 */
  body::before { content:''; position:fixed; inset:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(0,240,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,.06) 1px, transparent 1px);
    background-size:44px 44px; }
  /* 扫描线 */
  body::after { content:''; position:fixed; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 3px, rgba(0,240,255,.03) 3px 4px); }

  /* 四角 L 形科技角标 */
  .corner { position:fixed; width:46px; height:46px; border:0 solid #00f0ff; z-index:5;
            filter:drop-shadow(0 0 6px #00f0ff); }
  .corner.tl { top:18px; left:18px; border-top-width:3px; border-left-width:3px; }
  .corner.tr { top:18px; right:18px; border-top-width:3px; border-right-width:3px; }
  .corner.bl { bottom:25vh; left:18px; border-bottom-width:3px; border-left-width:3px; }
  .corner.br { bottom:25vh; right:18px; border-bottom-width:3px; border-right-width:3px; }

  /* 立绘（左侧，底部对齐，青色霓虹外发光 20px） */
  .figure-wrap { position:absolute; left:2vw; bottom:-68vh;
                 filter:drop-shadow(0 0 20px #00f0ff); }
  .figure { display:block; width:auto; height:130vh; }
  .halo { position:absolute; left:50%; bottom:6%; width:130%; height:40%; transform:translateX(-50%);
          background:radial-gradient(ellipse, rgba(0,240,255,.22), transparent 65%); pointer-events:none; }
  .scan { position:absolute; left:-10%; right:-10%; height:4px;
          background:linear-gradient(90deg, transparent, rgba(0,240,255,.5), transparent);
          animation:scan 3s linear infinite; pointer-events:none; }
  @keyframes scan { 0%{ top:10%; } 50%{ top:80%; } 100%{ top:10%; } }

  /* 对话框（底部 25vh，青色动态霓虹边框） */
  .dialog { position:absolute; left:0; right:0; bottom:0; height:25vh; z-index:6;
            background:rgba(10,14,23,.92); border-top:1px solid #00f0ff;
            box-shadow:0 0 20px #00f0ff, inset 0 0 30px rgba(0,240,255,.06);
            animation:borderGlow 2.4s ease-in-out infinite; padding:3vh 4vw 2vh 12vw; cursor:pointer; }
  @keyframes borderGlow { 0%,100%{ box-shadow:0 0 16px #00f0ff, inset 0 0 30px rgba(0,240,255,.06);}
                          50%{ box-shadow:0 0 32px #00f0ff, inset 0 0 36px rgba(0,240,255,.10);} }
  .name { color:#ff00c8; font-weight:700; font-size:clamp(18px,3.2vh,28px); letter-spacing:.18em;
          margin-bottom:1vh; text-shadow:0 0 8px #ff00c8, 0 0 20px rgba(255,0,200,.6); }
  .text { color:#e0f7fa; font-size:clamp(16px,2.9vh,26px); line-height:1.8; letter-spacing:.04em; }
  .prompt { position:absolute; right:2.5vw; bottom:1.6vh; color:#00f0ff; font-size:18px;
            animation:blink 1s steps(2) infinite; text-shadow:0 0 8px #00f0ff; }
  @keyframes blink { 0%,49%{ opacity:1;} 50%,100%{ opacity:0;} }

  /* 标题 / 结尾提示 */
  .boot { position:fixed; top:4vh; left:50%; transform:translateX(-50%);
          font-family:'Orbitron',monospace; font-size:clamp(12px,1.8vh,16px); letter-spacing:.4em;
          color:rgba(0,240,255,.5); text-shadow:0 0 10px rgba(0,240,255,.4); }
  .end-tip { position:fixed; left:50%; bottom:26vh; transform:translateX(-50%);
             font-size:14px; letter-spacing:.2em; color:rgba(255,0,200,.8);
             text-shadow:0 0 10px rgba(255,0,200,.5); opacity:0; transition:opacity .5s; }
  .end-tip.show { opacity:1; }
</style>
</head>
<body>
  <div class="boot">新上海 2049 · 终端接入</div>

  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>

  <!-- 立绘 -->
  <div class="figure-wrap">
    <img class="figure" src="portrait.png" alt="立绘" draggable="false">
    <div class="halo"></div>
    <div class="scan"></div>
  </div>

  <!-- 对话框 -->
  <div class="dialog" id="dialog">
    <div class="name" id="dname">数据终端</div>
    <div class="text" id="dtext"></div>
    <div class="prompt">>></div>
  </div>

  <div class="end-tip" id="endtip">-- 传输结束，点击重新连接 --</div>

<script>
"use strict";
const dialogues = [
  { name: "数据终端", text: ">> 链接已建立。意识上传完成，欢迎来到新上海2049。" },
  { name: "神秘黑客", text: "别出声……你的信号被追踪了。还记得你的代号吗？" },
  { name: "系统警告", text: "⚠️ 警告：检测到非法入侵协议。" },
  { name: "神秘黑客", text: "别理那个弹窗。快说，你是\u2018夜枭\u2019还是\u2018幽灵\u2019？" },
  { name: "数据终端", text: "……身份识别失败。点击继续，重新连接。" }
];
let idx = 0, ended = false;
const nameEl = document.getElementById("dname");
const textEl = document.getElementById("dtext");
const tipEl = document.getElementById("endtip");
function render(){
  const d = dialogues[idx];
  nameEl.textContent = d.name;
  textEl.textContent = d.text;
}
document.getElementById("dialog").addEventListener("click", ()=>{
  if (ended){
    idx = 0; ended = false; tipEl.classList.remove("show");
    render();
    return;
  }
  idx++;
  if (idx >= dialogues.length){
    ended = true;
    tipEl.classList.add("show");
  } else {
    render();
  }
});
render();
</script>
</body>
</html>
